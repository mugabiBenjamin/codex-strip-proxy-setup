# Single source of truth for the codex-strip-proxy setup package.
# src/manifest.py loads and validates this file; nothing else reads it directly.

[proxy]
commit = "f28af95966200a614c671b73aa3e1e581ac2141b"
sha256 = "422f19081195d5586521e1abce5789b12a709ee60dbc93e19a774a4445965fc4"
upstream = "https://agentrouter.org"
repository = "https://github.com/AnnaofArendelle/codex-strip-proxy.git"

[defaults]
port = 8899
codex_home_env_var = "CODEX_HOME"

[package]
version = "1.0.0"
# Every file that must ship with the package. ci/verify_files.sh checks that
# these paths exist; CI also requires them to be tracked in Git.
owned_files = [
  ".gitignore",
  "LICENSE",
  "README.md",
  "VALIDATION.md",
  ".github/workflows/ci.yml",
  "manifest.toml",
  "src/__init__.py",
  "src/manifest.py",
  "src/env.py",
  "src/config_io.py",
  "src/config_editor.py",
  "src/service.py",
  "src/template.py",
  "src/sanitizer_check.py",
  "bin/proxy-config",
  "bin/verify-proxy",
  "installer/setup.sh",
  "installer/prereqs.sh",
  "installer/service_install.sh",
  "installer/probe.sh",
  "templates/codex-strip-proxy.service.tmpl",
  "tests/test_manifest.py",
  "tests/test_config_io.py",
  "tests/test_config_editor.py",
  "tests/test_service_template.py",
  "tests/test_sanitizer_check.py",
  "ci/verify_files.sh",
]
